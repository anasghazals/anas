<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>رحلات من تقاد إلى حلب</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
</head>
<body>
  <!-- شاشة التحميل -->
  <div id="loading" class="screen active">
    <div class="loader"></div>
    <p>جاري التحميل...</p>
  </div>

  <!-- شاشة الترحيب واختيار الدور -->
  <div id="welcome-screen" class="screen">
    <div class="container">
      <div class="logo">🚐</div>
      <h1>أهلاً بكم في تطبيق</h1>
      <h2>رحلات من تقاد إلى حلب</h2>
      <p class="creator">تم إنشاء هذا التطبيق من قبل أنس غزال</p>

      <div class="note">
        ⚠️ ملاحظة: بعد اختيار الدور (سائق أو راكب) لا يمكن تغييره لاحقاً
      </div>

      <div class="role-buttons">
        <button class="btn btn-driver" onclick="selectRole('driver')">
          <span class="icon">🚗</span>
          أنا سائق
        </button>
        <button class="btn btn-passenger" onclick="selectRole('passenger')">
          <span class="icon">👤</span>
          أنا راكب
        </button>
      </div>
    </div>
  </div>

  <!-- شاشة السائق - إنشاء رحلة -->
  <div id="driver-screen" class="screen">
    <div class="header">
      <h2>إضافة رحلة جديدة</h2>
      <button class="btn-small" onclick="showMyTrips()">رحلاتي</button>
    </div>

    <div class="container form-container">
      <form id="trip-form" onsubmit="publishTrip(event)">
        <div class="form-group">
          <label>الاسم الكامل *</label>
          <input type="text" id="driver-name" required placeholder="اكتب اسمك الكامل" />
        </div>

        <div class="form-group">
          <label>نوع السيارة *</label>
          <input type="text" id="car-type" required placeholder="مثال: كيا ريو / هيونداي إلنترا" />
        </div>

        <div class="form-group">
          <label>رقم الواتساب *</label>
          <input type="tel" id="whatsapp" required placeholder="09xxxxxxxx" dir="ltr" />
        </div>

        <div class="form-group">
          <label>الاتجاه *</label>
          <select id="direction" required>
            <option value="">اختر الاتجاه</option>
            <option value="من تقاد إلى حلب">من تقاد إلى حلب</option>
            <option value="من حلب إلى تقاد">من حلب إلى تقاد</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>

        <div class="form-group" id="other-direction-group" style="display:none;">
          <label>حدد الاتجاه</label>
          <input type="text" id="other-direction" placeholder="اكتب الاتجاه" />
        </div>

        <div class="form-group">
          <label>ساعة الانطلاق *</label>
          <input type="time" id="trip-time" required />
        </div>

        <div class="form-group">
          <label>السعر (ل.س) *</label>
          <input type="number" id="price" required placeholder="مثال: 50000" min="0" />
        </div>

        <div class="form-group">
          <label>صورة مقدمة السيارة *</label>
          <input type="file" id="car-photo" accept="image/*" required />
          <div id="photo-preview" class="photo-preview"></div>
        </div>

        <button type="submit" class="btn btn-primary" id="publish-btn">نشر الرحلة</button>
      </form>
    </div>
  </div>

  <!-- شاشة رحلات السائق (مع الحجوزات) -->
  <div id="my-trips-screen" class="screen">
    <div class="header">
      <button class="btn-back" onclick="showDriverScreen()">← رجوع</button>
      <h2>رحلاتي والحجوزات</h2>
    </div>
    <div class="container" id="my-trips-list">
      <!-- يتم تعبئتها بالجافاسكريبت -->
    </div>
  </div>

  <!-- شاشة الراكب - إدخال الاسم -->
  <div id="passenger-name-screen" class="screen">
    <div class="container">
      <h2>مرحباً بك كراكب</h2>
      <p class="subtitle">اكتب اسمك الثلاثي (لن تتمكن من تغييره لاحقاً)</p>
      <div class="form-group">
        <input type="text" id="passenger-name" placeholder="الاسم الثلاثي الكامل" required />
      </div>
      <button class="btn btn-primary" onclick="savePassengerName()">دخول</button>
    </div>
  </div>

  <!-- شاشة الراكب - قائمة الرحلات -->
  <div id="passenger-screen" class="screen">
    <div class="header">
      <h2>الرحلات المتاحة</h2>
      <span id="passenger-greeting"></span>
    </div>
    <div class="container" id="trips-list">
      <!-- يتم تعبئتها بالجافاسكريبت -->
    </div>
  </div>

  <!-- رسالة نجاح / خطأ -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
